name: Refresh npm lockfile

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'security/npm-lock-audit-2026-10-05'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || 'security/npm-lock-audit-2026-10-05' }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Generate package-lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit package-lock
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: generate npm lockfile"
          git push origin HEAD:security/npm-lock-audit-2026-10-05
